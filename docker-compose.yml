# This service is an independent repo. It joins the shared, pre-created
# "microservices-net" network so the frontend (in a different repo/compose
# project) can reach it by container name.
#
# One-time, before the first `up`:
#   docker network create microservices-net
#
# Then from this folder:
#   docker-compose up -d --build

services:
  auth-service:
    build: .
    image: auth-service:local
    container_name: auth-service
    environment:
      PORT: "3000"
      DB_HOST: auth-db
      DB_PORT: "5432"
      DB_USER: auth
      DB_PASSWORD: authpass
      DB_NAME: authdb
    ports:
      # Optional: exposed on the host only so you can curl it directly while
      # debugging. The frontend does NOT use this; it talks over the network.
      - "3000:3000"
    depends_on:
      auth-db:
        condition: service_healthy
      # Do not start the app until schema migrations have been applied.
      migrate:
        condition: service_completed_successfully
    networks:
      - microservices-net
    restart: unless-stopped

  # One-shot migration job: applies any pending SQL migrations in ./db/migrations
  # to auth-db, records them in flyway_schema_history, then exits (Exited 0).
  # It is NOT a long-running service; "Exited (0)" means success.
  migrate:
    image: flyway/flyway:10-alpine
    container_name: auth-migrate
    command: -connectRetries=20 -baselineOnMigrate=true migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://auth-db:5432/authdb
      FLYWAY_USER: auth
      FLYWAY_PASSWORD: authpass
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - microservices-net
    restart: "no"

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: authpass
      POSTGRES_DB: authdb
    volumes:
      - auth-db-data:/var/lib/postgresql/data
      # NOTE: schema/seed is now owned by the Flyway "migrate" service, not by
      # Postgres' docker-entrypoint-initdb.d. The old ./db/init.sql file is kept
      # in the repo for reference but is intentionally no longer mounted here,
      # otherwise it would double-run the seed on first boot.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - microservices-net
    restart: unless-stopped

volumes:
  auth-db-data:

# Shared network is created OUTSIDE this compose file (external: true) so
# multiple independent service repos can all attach to the same network.
networks:
  microservices-net:
    external: true
