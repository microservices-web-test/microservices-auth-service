apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-db-data
  namespace: microservices
  labels:
    app: auth-db
    app.kubernetes.io/part-of: microservices-demo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-db
  namespace: microservices
  labels:
    app: auth-db
    app.kubernetes.io/part-of: microservices-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auth-db
  template:
    metadata:
      labels:
        app: auth-db
        app.kubernetes.io/part-of: microservices-demo
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: auth-db-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: auth-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: auth-db
  namespace: microservices
  labels:
    app: auth-db
    app.kubernetes.io/part-of: microservices-demo
spec:
  type: ClusterIP
  selector:
    app: auth-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
