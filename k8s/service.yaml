# Internal (ClusterIP) Service. The frontend's nginx BFF reaches it at
# http://auth-service.microservices.svc.cluster.local:3000 — so the name and
# port here MUST stay "auth-service" / 3000.
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: microservices
  labels:
    app: auth-service
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: microservices-demo
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: http
      port: 3000
      targetPort: http
