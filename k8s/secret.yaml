# Credentials shared by the auth-db Postgres and the auth-service app.
# NOTE: demo credentials committed for convenience, matching the original
# docker-compose defaults. For anything real, create this Secret out-of-band
# (kubectl create secret generic ...) and keep it out of git.
apiVersion: v1
kind: Secret
metadata:
  name: auth-db-credentials
  namespace: microservices
  labels:
    app: auth-db
    app.kubernetes.io/part-of: microservices-demo
type: Opaque
stringData:
  POSTGRES_USER: auth
  POSTGRES_PASSWORD: authpass
  POSTGRES_DB: authdb
