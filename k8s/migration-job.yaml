apiVersion: batch/v1
kind: Job
metadata:
  name: auth-migrate
  namespace: microservices
  labels:
    app: auth-migrate
    app.kubernetes.io/part-of: microservices-demo
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: auth-migrate
        app.kubernetes.io/part-of: microservices-demo
    spec:
      restartPolicy: OnFailure
      containers:
        - name: flyway
          image: flyway/flyway:10
          args:
            - "-connectRetries=30"
            - "-baselineOnMigrate=true"
            - "migrate"
          env:
            - name: FLYWAY_URL
              value: jdbc:postgresql://auth-db:5432/authdb
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: auth-db-credentials
                  key: POSTGRES_USER
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-db-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: sql
              mountPath: /flyway/sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: auth-migrations
